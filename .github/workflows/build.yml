name: Build VipGram APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'vipmod.patch'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (vipmod.patch lives here)
        uses: actions/checkout@v4

      - name: Clone latest official Telegram source + all submodules
        run: |
          git clone https://github.com/DrKLO/Telegram.git telegram
          cd telegram
          git log -1 --format="SOURCE: %h %s"
          # native code compiles from these submodules — ALL of them are required
          git submodule update --init --depth 1

      - name: Apply VipMod patch
        run: |
          cd telegram
          git apply --check ../vipmod.patch || (echo "::error::Patch failed to apply — source may have changed" && exit 1)
          git apply ../vipmod.patch
          echo "=== Applied mods ==="
          grep -n "VipMod" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Inject private api_id / api_hash (from repo secrets)
        working-directory: telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          sed -i "s|public static int APP_ID = [0-9]*;|public static int APP_ID = ${API_ID};|" \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s|public static String APP_HASH = \"[0-9a-f]*\";|public static String APP_HASH = \"${API_HASH}\";|" \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          grep -q "APP_ID = ${API_ID};" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java && echo "APP_ID injected OK"
          grep -q "${API_HASH}" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java && echo "APP_HASH injected OK"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Build release APK (full native compile)
        working-directory: telegram
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # CI has 7GB RAM — restore normal build memory + parallelism
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          sed -i 's/org.gradle.parallel=.*/org.gradle.parallel=true/' gradle.properties
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apks
          find telegram/TMessagesProj_App/build/outputs/apk -name "*.apk" -exec cp {} apks/ \; || true
          ls -la apks/
          if [ -z "$(ls -A apks 2>/dev/null)" ]; then
            echo "::error::No APK found in outputs"; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VipGram-APK
          path: apks/*.apk
          retention-days: 30
          compression-level: 0
