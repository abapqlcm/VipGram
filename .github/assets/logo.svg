<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#c98a1e"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset="1" stop-color="#2a7fff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2a7fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a7fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- پس‌زمینه -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="440" r="430" fill="url(#glow)"/>

  <!-- حلقه VIP — فقط بالای متن -->
  <path d="M 152 470 A 360 360 0 1 1 872 470" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>

  <!-- تاج -->
  <path d="M 398 172 L 452 226 L 512 162 L 572 226 L 626 172 L 606 250 L 418 250 Z" fill="url(#gold)"/>

  <!-- حرف V -->
  <path d="M 356 300 L 512 612 L 668 300 L 588 300 L 512 460 L 436 300 Z" fill="url(#gold)"/>

  <!-- هواپیمای تلگرام — فرم کامل و بزرگ‌تر -->
  <g transform="translate(672 520) rotate(-18)">
    <path d="M -10 118 L 158 42 L -10 -34 L -10 26 L 96 42 L -10 58 Z" fill="url(#plane)"/>
  </g>

  <!-- متن داخل چیدمان مستقل -->
  <text x="512" y="840" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="800"
        fill="#ffffff" letter-spacing="6">VIP</text>
  <rect x="322" y="866" width="380" height="10" rx="5" fill="#f5b942"/>
  <text x="512" y="946" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700"
        fill="#f5b942" letter-spacing="14">GRAM</text>
</svg>
